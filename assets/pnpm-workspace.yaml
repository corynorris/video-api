allowBuilds:
  "@parcel/watcher": true
  fsevents: true
  jss: true
  webpack-cli: true

# Security overrides (pnpm audit --fix); remove as upstreams pick up patches.
overrides:
  "@babel/runtime@<7.26.10": ">=7.29.7"
  # react-event-listener (via @kenshooui/react-multi-select) pins the 2017
  # Babel beta; semver ranges above exclude prereleases, so name it exactly.
  "@babel/runtime@7.0.0-beta.42": ">=7.29.7"
  baseline-browser-mapping@>=2.0.0 <2.11.0: ">=2.11.0"
  brace-expansion@<2: ">=1.1.21"
  brace-expansion@>=2 <4: ">=2.1.7"
  brace-expansion@>=4: ">=5.0.12"
  brace-expansion@5.0.7: ">=5.0.12"
  eslint-plugin-react>minimatch: ">=11.0.1"
  browserslist@<=4.28.6: ">=4.28.7"
  glob@>=9.0.0 <=14.0.1: ">=14.0.2"
  minimatch@>=7.0.0 <11.0.1: ">=11.0.1"
  node-fetch@<2.6.7: ">=2.6.7"
  phoenix@>=1.8.0-rc.0 <1.8.9: ">=1.8.9"
  source-map-js@>=1.0.0 <1.2.2: ">=1.2.2"
  ua-parser-js@>=0.7.30 <0.7.33: ">=0.7.33"
