name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    name: Assets (format, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: assets/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run build

  elixir:
    name: Elixir (compile, test)
    # The app pins ecto 3.3, which cannot compile on Elixir >= 1.12 (it defines
    # a `dynamic/0` type that later became a built-in) and setup-beam no longer
    # ships OTP 23 builds, so run in the era-correct hexpm image. Postgres runs
    # as a service; config/test.exs reads POSTGRES_HOST for the connection.
    runs-on: ubuntu-latest
    container: hexpm/elixir:1.11.4-erlang-23.3.4.18-debian-bullseye-20260610-slim
    env:
      MIX_ENV: test
      POSTGRES_HOST: postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ hashFiles('mix.lock') }}
      - name: Compile
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile
      - name: Test
        run: mix test
